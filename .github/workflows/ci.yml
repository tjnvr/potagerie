name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Checks and tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the WebKitGTK libraries Tauri needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - run: pnpm --dir front install --frozen-lockfile

      - name: cargo fmt
        run: cargo fmt --all --check
      # src-tauri embeds front/dist at compile time: build the interface first.
      - name: Build the interface
        run: pnpm --dir front build
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: pnpm check
        run: pnpm --dir front check
      - name: pnpm test
        run: pnpm --dir front test

  # Use cases of the interface (docs/POT-00_test-matrix.md), in Chromium and WebKit.
  # Pinned to ubuntu-24.04: Playwright does not support the newer ubuntu-latest yet.
  e2e:
    name: Use cases (e2e)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - run: pnpm --dir front install --frozen-lockfile
      - name: Cache the Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('front/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      # The system libraries are not cached: --with-deps installs them every time.
      - name: Install the browsers
        run: pnpm --dir front exec playwright install --with-deps chromium webkit
      - name: pnpm e2e
        run: pnpm --dir front e2e
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: front/test-results
          if-no-files-found: ignore

  # Smoke tests of the real app (APP-xx in docs/POT-00_test-matrix.md): the built
  # binary, its webview, the Rust commands and SQLite, through tauri-driver.
  # Not on macOS: tauri-driver does not support WKWebView.
  app:
    name: Real app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, WebKitGTK
            os: ubuntu-24.04
          - name: Windows, WebView2
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK, its WebDriver and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev webkit2gtk-driver xvfb

      # msedgedriver must match the WebView2 runtime, not the Edge browser.
      - name: Download the msedgedriver of the WebView2 version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Write-Host "WebView2 $version"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP\edgedriver.zip"
          Expand-Archive "$env:RUNNER_TEMP\edgedriver.zip" -DestinationPath "$env:RUNNER_TEMP\edgedriver"
          "NATIVE_DRIVER=$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: app
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - run: pnpm --dir front install --frozen-lockfile

      - name: Build the app (no installer)
        run: pnpm dlx @tauri-apps/cli@2.12.4 build --no-bundle
      - name: Diagnose a direct launch (temporary)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force e2e-app\results | Out-Null
          $env:POTAGERIE_DATA_DIR = "$env:RUNNER_TEMP\diag"
          $p = Start-Process -FilePath target\release\potagerie.exe -PassThru
          Start-Sleep -Seconds 25
          Write-Host "exited: $($p.HasExited) code: $($p.ExitCode)"
          Write-Host "data folder: $(Test-Path "$env:RUNNER_TEMP\diag")"; Get-ChildItem "$env:RUNNER_TEMP\diag" -ErrorAction SilentlyContinue
          Get-ChildItem "$env:LOCALAPPDATA\garden.potagerie" -Recurse -Depth 1 -ErrorAction SilentlyContinue | Select-Object -First 20 FullName
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'potagerie|msedgewebview2' } | ForEach-Object { "$($_.ProcessId) $($_.Name) $($_.CommandLine)".Substring(0, [Math]::Min(300, "$($_.ProcessId) $($_.Name) $($_.CommandLine)".Length)) }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("e2e-app\results\desktop.png")
          if (-not $p.HasExited) { Stop-Process -Id $p.Id }
          & $env:NATIVE_DRIVER --version
          Get-ChildItem 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients' | ForEach-Object { "$($_.PSChildName) $((Get-ItemProperty $_.PSPath).name) $((Get-ItemProperty $_.PSPath).pv)" }
      - name: Diagnose a direct launch (temporary)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          POTAGERIE_DATA_DIR="$RUNNER_TEMP/diag" timeout 20 xvfb-run -a target/release/potagerie || echo "exit $?"
          ls -la "$RUNNER_TEMP/diag"
      - name: Smoke tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node --test e2e-app/smoke.test.mjs
          else
            node --test e2e-app/smoke.test.mjs
          fi
      - name: Keep the screenshots of failed steps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-smoke-${{ runner.os }}
          path: e2e-app/results
          if-no-files-found: ignore

  bundle:
    name: Bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            artifacts: |
              target/universal-apple-darwin/release/bundle/macos/*.app
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            rust-targets: ""
            args: --bundles msi,nsis
            artifacts: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - run: pnpm --dir front install --frozen-lockfile

      # Not signed (S05 §3): right click then Open on macOS, "Run anyway" on Windows.
      - name: cargo tauri build
        run: pnpm dlx @tauri-apps/cli@2.12.4 build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: Potagerie-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
