name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Checks and tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the WebKitGTK libraries Tauri needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - run: pnpm --dir front install --frozen-lockfile

      - name: cargo fmt
        run: cargo fmt --all --check
      # src-tauri embeds front/dist at compile time: build the interface first.
      - name: Build the interface
        run: pnpm --dir front build
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: pnpm check
        run: pnpm --dir front check
      - name: pnpm test
        run: pnpm --dir front test

  # Use cases of the interface (docs/POT-00_test-matrix.md), in Chromium and WebKit.
  # Pinned to ubuntu-24.04: Playwright does not support the newer ubuntu-latest yet.
  e2e:
    name: Use cases (e2e)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - run: pnpm --dir front install --frozen-lockfile
      - name: Install the browsers
        run: pnpm --dir front exec playwright install --with-deps chromium webkit
      - name: pnpm e2e
        run: pnpm --dir front e2e
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: front/test-results
          if-no-files-found: ignore

  bundle:
    name: Bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            artifacts: |
              target/universal-apple-darwin/release/bundle/macos/*.app
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            rust-targets: ""
            args: --bundles msi,nsis
            artifacts: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - run: pnpm --dir front install --frozen-lockfile

      # Not signed (S05 §3): right click then Open on macOS, "Run anyway" on Windows.
      - name: cargo tauri build
        run: pnpm dlx @tauri-apps/cli@2.12.4 build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: Potagerie-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
