name: Release

# Runs on a version tag (git tag v0.1.0 && git push origin v0.1.0).
# Builds unsigned installers and attaches them to the GitHub release of the tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            artifacts: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            rust-targets: ""
            args: --bundles msi,nsis
            artifacts: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: The app version must match the tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tauri=$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)
          cargo=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' src-tauri/Cargo.toml | head -1)
          pkg=$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' front/package.json | head -1)
          echo "tag=$tag tauri.conf.json=$tauri Cargo.toml=$cargo package.json=$pkg"
          if [ "$tag" != "$tauri" ] || [ "$tag" != "$cargo" ] || [ "$tag" != "$pkg" ]; then
            echo "::error::Version mismatch: bump the three versions to $tag before tagging"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - run: pnpm --dir front install --frozen-lockfile

      # Same build step as ci.yml (bundle job); not signed (S05 §3).
      - name: cargo tauri build
        run: pnpm dlx @tauri-apps/cli@2.12.4 build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: Potagerie-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: GitHub release
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R dist
          # The installers sit in sub-folders (msi/, nsis/): send files only.
          mapfile -t files < <(find dist -type f)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file .github/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "Potagerie $GITHUB_REF_NAME" --notes-file .github/release-notes.md --prerelease
          fi
      # Keep only the latest pre-release of a major: delete the older ones of the
      # same major (the tags stay). A release only deletes lower versions, so two
      # builds that finish out of order cannot delete the newer one.
      - name: Delete the older pre-releases of this major
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          major="${GITHUB_REF_NAME#v}"
          major="${major%%.*}"
          gh release list --limit 200 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' | while read -r tag; do
            [ "$tag" = "$GITHUB_REF_NAME" ] && continue
            case "$tag" in "v$major."*) ;; *) continue ;; esac
            oldest="$(printf '%s\n%s\n' "$tag" "$GITHUB_REF_NAME" | sort -V | head -n 1)"
            if [ "$oldest" = "$tag" ]; then
              echo "Deleting the pre-release $tag"
              gh release delete "$tag" --yes
            fi
          done
