[workspace]
resolver = "3"
members = ["crates/catalogue", "crates/plan", "crates/store", "crates/export", "src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
catalogue = { path = "crates/catalogue" }
plan = { path = "crates/plan" }
store = { path = "crates/store" }
export = { path = "crates/export" }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
rusqlite = { version = "0.43", features = ["bundled"] }
resvg = { version = "0.45", default-features = false, features = ["text"] }
svg2pdf = "0.13"
tempfile = "3"
# tauri-specta is a release candidate: pin exact versions (S05 §10).
specta = { version = "=2.0.0-rc.28", features = ["derive", "chrono", "uuid"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
tauri = { version = "2.12", features = ["specta"] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-dialog = "2.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
