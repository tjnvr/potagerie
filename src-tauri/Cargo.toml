[package]
name = "potagerie"
version = "0.2.2"
description = "Potagerie: vegetable garden planner (Tauri app)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (Tauri layout).
name = "potagerie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
catalogue.workspace = true
chrono = { workspace = true, features = ["clock"] }
export.workspace = true
plan = { workspace = true, features = ["specta"] }
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
store.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-specta.workspace = true
thiserror.workspace = true

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true

[lints]
workspace = true
